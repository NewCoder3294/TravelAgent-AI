[tool.poetry]
name = "trip-planner-backend"
version = "1.0.0"
description = "AI-powered trip planner backend with Parallel API and Claude SDK"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
